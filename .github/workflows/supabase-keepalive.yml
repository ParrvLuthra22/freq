name: Supabase keep-alive

# Free Supabase projects auto-pause after a week with no activity. This runs a
# trivial, genuinely-anon-readable query (see migration
# 20260810000002_keepalive_anon_read.sql) often enough to keep the project
# from ever going to sleep, using only the public anon key — no service-role
# secret needed for a job that does nothing but prove the project is awake.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query artists_corpus as anon
        run: |
          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/artists_corpus?select=name&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          cat /tmp/body
          echo
          if [ "$status" != "200" ]; then
            echo "Keep-alive query failed with status $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
